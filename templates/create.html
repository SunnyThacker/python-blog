{% extends "base.html" %}

{% block title %}Create Post - My Blog{% endblock %}

{% block content %}
<div class="create-post">
    <h2>Create a New Post</h2>
    
    <form id="postForm" class="post-form">
        <div class="form-group">
            <label for="title">Post Title</label>
            <input type="text" id="title" name="title" required placeholder="Enter post title">
        </div>
        
        <div class="form-group">
            <label for="author">Author Name</label>
            <input type="text" id="author" name="author" placeholder="Your name" value="Admin">
        </div>
        
        <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" name="content" rows="10" required placeholder="Write your post content here..."></textarea>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Publish Post</button>
            <a href="/" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<script>
document.getElementById('postForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const title = document.getElementById('title').value;
    const author = document.getElementById('author').value;
    const content = document.getElementById('content').value;
    
    try {
        const response = await fetch('/create', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ title, author, content })
        });
        
        if (response.ok) {
            alert('Post created successfully!');
            window.location.href = '/';
        } else {
            alert('Error creating post');
        }
    } catch (error) {
        console.error('Error:', error);
        alert('Error creating post');
    }
});
</script>
{% endblock %}
